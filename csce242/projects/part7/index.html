<!DOCTYPE html>
<html>
    <head>
        <title>Skate Columbia</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="content">
            <header>
                <div id="logo">
                    <div class="logo-line"><span class="gold">S</span>KATE</div>
                    <div class="logo-line"><span class="gold">C</span>OLUMBIA</div>
                </div>
                <nav id="main-nav">
                    <span id="menu-toggle">&#9660;</span>
                    <ul id="nav-list">
                        <li id="home-link" class="active"><a href="index.html">Home</a></li>
                        <li id="spots-link"><a href="spots.html">Spots</a></li>
                        <li id="shops-link"><a href="shops.html">Shops</a></li>
                        <li id="tricks-link"><a href="tricks.html">Tricks</a></li>
                    </ul>
                </nav>
            </header>
            <main>
                <section id="intro">
                    <h1>YOUR COMPLETE GUIDE TO SKATEBOARDING IN COLUMBIA</h1>
                    <div id="intro-map">
                        <iframe
                            src="https://www.google.com/maps?q=Columbia,+SC&output=embed"
                            title="Map of Columbia, SC"
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"
                            allowfullscreen>
                        </iframe>
                    </div>
                </section>
                <section id="images">
                    <a href="spots.html" id="card-spots" class="image-card">
                        <div class="card-content">
                            <h2>Spots</h2>
                            <p>See a curated list from local Columbia skaters</p>
                        </div>
                    </a>
                    <a href="shops.html" id="card-shops" class="image-card">
                        <div class="card-content">
                            <h2>Shops</h2>
                            <p>View specialty skate shops loved by locals</p>
                        </div>
                    </a>
                    <a href="tricks.html" id="card-tricks" class="image-card">
                        <div class="card-content">
                            <h2>Tricks</h2>
                            <p>Learn tips on how to perform various tricks</p>
                        </div>
                    </a>
                </section>
            </main>
            <footer>
                <div id="footer-contact">
                    <h2>Contact Us</h2>
                    <form id="contact-form" action="" method="POST">
                        <p>
                            <label for="name">Name:</label>
                            <input type="text" name="name" required />
                        </p>
                        <p>
                            <label for="email">Email:</label>
                            <input type="email" name="email" required />
                        </p>
                        <p>
                            <textarea name="message" required placeholder="Message"></textarea>
                        </p>
                        <p>
                            <button type="submit">Submit</button>
                        </p>
                        <p id="result"></p>
                    </form>
                </div>
                <p id="footer-copy">&copy; MrKlauk</p>
            </footer>
        </div>
        <script src="scripts/index.js"></script>
        <script src="scripts/contact.js"></script>
    </body>
</html>
