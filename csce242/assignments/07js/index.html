<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 7</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    </head>
    <body>
        <div id="content">
            <header>
                <h1>Assignment 7</h1>
            </header>
            <main>
                <h2>Introduction to JavaScript</h2>
                <div id="assignments" class="three columns">
                    <section class="speech">
                        <h2>Speech</h2>
                        <div id="speech-bubble">
                            Hi
                        </div>
                    </section>
                    <section class="beverage">
                            <h2>Beverage</h2>
                            <p>Pick your morning beverage:</p>
                            <select id="beverage-select">
                                <option value="Coffee">Coffee</option>
                                <option value="Tea">Tea</option>
                                <option value="Orange Juice">Orange Juice</option>
                            </select>
                            <p id="beverage-message"></p>
                    </section>
                    <section class="sticker">
                            <h2>Add a Sticker</h2>
                            <div class="sticker-area">
                                <img src="images/little-cat.webp" alt="Little Cat" id="cat">
                            </div>
                    </section>
                </div>
            </main>
        </div>
        <script src="scripts/index.js"></script>    
    </body>
</html>
